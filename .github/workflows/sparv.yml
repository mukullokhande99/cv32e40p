name: sparv

on:
  push:
    branches: [feature/sparv]
  pull_request:
    branches: [feature/hamsa-dual-issue, CV32e40p-original, master]

concurrency:
  group: sparv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator

      - name: Compile and run SPARV prefetch controller test
        run: |
          iverilog -g2012 -o /tmp/sparv_prefetch \
            rtl/cv32e40p_sparv_prefetch_ctrl.sv \
            bhv/cv32e40p_sparv_prefetch_ctrl_tb.sv
          vvp /tmp/sparv_prefetch

      - name: Compile and run SPARV prefetch directory test
        run: |
          iverilog -g2012 -o /tmp/sparv_prefetch_dir \
            rtl/cv32e40p_sparv_prefetch_directory.sv \
            bhv/cv32e40p_sparv_prefetch_directory_tb.sv
          vvp /tmp/sparv_prefetch_dir

      - name: Compile and run SPARV refill arbiter test
        run: |
          iverilog -g2012 -o /tmp/sparv_refill_arb \
            rtl/cv32e40p_sparv_refill_arbiter.sv \
            bhv/cv32e40p_sparv_refill_arbiter_tb.sv
          vvp /tmp/sparv_refill_arb

      - name: Compile and run SPARV SIMD MAC/DOTP reference test
        run: |
          iverilog -g2012 -o /tmp/sparv_mac_ref \
            rtl/cv32e40p_sparv_mac_dotp_ref.sv \
            bhv/cv32e40p_sparv_mac_dotp_ref_tb.sv
          vvp /tmp/sparv_mac_ref

      - name: Compile and run SPARV multicycle MAC/DOTP engine test
        run: |
          iverilog -g2012 -o /tmp/sparv_mac_engine \
            rtl/cv32e40p_sparv_mac_dotp_ref.sv \
            rtl/cv32e40p_sparv_mac_dotp_engine.sv \
            bhv/cv32e40p_sparv_mac_dotp_engine_tb.sv
          vvp /tmp/sparv_mac_engine

      - name: Compile and run integrated SPARV multiplier stress test
        run: |
          iverilog -g2012 -I rtl/include -o /tmp/sparv_mult \
            rtl/include/cv32e40p_pkg.sv \
            rtl/cv32e40p_mult.sv \
            rtl/cv32e40p_sparv_mac_dotp_ref.sv \
            rtl/cv32e40p_sparv_mac_dotp_engine.sv \
            rtl/cv32e40p_sparv_mult.sv \
            bhv/cv32e40p_sparv_mult_tb.sv
          vvp /tmp/sparv_mult

      - name: Elaborate SPARV accelerator lane
        run: |
          iverilog -g2012 -s cv32e40p_sparv_accel_lane -o /tmp/sparv_accel_lane \
            rtl/cv32e40p_sparv_mac_dotp_ref.sv \
            rtl/cv32e40p_sparv_mac_dotp_engine.sv \
            rtl/cv32e40p_sparv_accel_lane.sv

      - name: Elaborate SPARV IF stage
        run: |
          iverilog -g2012 -I rtl/include -s cv32e40p_sparv_if_stage -o /tmp/sparv_if \
            rtl/include/cv32e40p_pkg.sv \
            rtl/cv32e40p_compressed_decoder.sv \
            rtl/cv32e40p_dual_decode_128.sv \
            rtl/cv32e40p_hamsa_frontend.sv \
            rtl/cv32e40p_hamsa_refill_32to128.sv \
            rtl/cv32e40p_hamsa_refill_native128.sv \
            rtl/cv32e40p_sparv_prefetch_ctrl.sv \
            rtl/cv32e40p_sparv_prefetch_directory.sv \
            rtl/cv32e40p_sparv_refill_arbiter.sv \
            rtl/cv32e40p_sparv_if_stage.sv

      - name: Elaborate SPARV counters and refill helpers
        run: |
          iverilog -g2012 -s cv32e40p_sparv_prefetch_counters -o /tmp/sparv_counters \
            rtl/cv32e40p_sparv_prefetch_counters.sv
          iverilog -g2012 -s cv32e40p_sparv_l0_prefetch_meta -o /tmp/sparv_meta \
            rtl/cv32e40p_sparv_l0_prefetch_meta.sv
          iverilog -g2012 -s cv32e40p_sparv_refill_manager -o /tmp/sparv_refill_mgr \
            rtl/cv32e40p_hamsa_refill_32to128.sv \
            rtl/cv32e40p_hamsa_refill_native128.sv \
            rtl/cv32e40p_sparv_refill_manager.sv

      - name: Generate SPARV full core
        run: |
          python3 -m py_compile util/gen_sparv_core.py util/gen_sparv_sim.py \
            evaluation/parse_sparv_log.py evaluation/run_example_vsim.py \
            evaluation/run_ppa_matrix.py evaluation/run_benchmark_matrix.py
          python3 util/gen_sparv_core.py
          test -s rtl/cv32e40p_sparv_ex_stage.sv
          test -s rtl/cv32e40p_core_sparv.sv
          test -s cv32e40p_manifest_sparv.flist
          grep -q "module cv32e40p_core_sparv" rtl/cv32e40p_core_sparv.sv
          grep -q "cv32e40p_sparv_if_stage" rtl/cv32e40p_core_sparv.sv
          grep -q "cv32e40p_sparv_ex_stage" rtl/cv32e40p_core_sparv.sv
          grep -q "cv32e40p_sparv_mult mult_i" rtl/cv32e40p_sparv_ex_stage.sv
          grep -q "cv32e40p_sparv_mult.sv" cv32e40p_manifest_sparv.flist

      - name: Generate executable SPARV-32 simulation
        run: |
          python3 util/gen_sparv_sim.py --native 0
          test -s rtl/cv32e40p_wrapper_sparv_32.sv
          test -s example_tb/core/cv32e40p_tb_subsystem_sparv_32.sv
          test -s example_tb/core/tb_top_sparv_32.sv
          test -s cv32e40p_manifest_sparv_32.flist
          grep -q "cv32e40p_core_sparv" rtl/cv32e40p_wrapper_sparv_32.sv
          grep -q "SPARV_METRIC" example_tb/core/tb_top_sparv_32.sv
          grep -q "cv32e40p_sparv_ex_stage.sv" cv32e40p_manifest_sparv_32.flist

      - name: Generate executable SPARV-128 simulation
        run: |
          python3 util/gen_sparv_sim.py --native 1
          test -s rtl/cv32e40p_wrapper_sparv_128.sv
          test -s example_tb/core/cv32e40p_tb_subsystem_sparv_128.sv
          test -s example_tb/core/tb_top_sparv_128.sv
          test -s cv32e40p_manifest_sparv_128.flist
          grep -q "cv32e40p_core_sparv" rtl/cv32e40p_wrapper_sparv_128.sv
          grep -q "SPARV_METRIC" example_tb/core/tb_top_sparv_128.sv

      - name: Smoke SPARV evaluation parser
        run: |
          printf 'cycles=100 retired=125 dual_pairs=30 l0_lookups=50 l0_hits=40 demand_misses=10 prefetch_fills=8 prefetch_useful=6 tcim_requests=20 mac8_ops=4 sparv_stall_cycles=7\n' >/tmp/sparv.log
          python3 evaluation/parse_sparv_log.py /tmp/sparv.log \
            --configuration sparv --benchmark smoke >/tmp/sparv.csv
          grep -q 'sparv,smoke' /tmp/sparv.csv

      - name: Smoke mixed benchmark matrix parser
        run: |
          python3 evaluation/run_benchmark_matrix.py \
            --benchmarks smoke --configs SPARV-32 \
            --command "printf 'HAMSA_METRIC cycles=100 issue1_retired=80 issue2_retired=20\\nSPARV_METRIC cycles=100 retired=100 dual_pairs=20 prefetch_useful=5 mac8_ops=2\\n'" \
            --out /tmp/matrix.csv
          grep -q 'SPARV-32' /tmp/matrix.csv
          grep -q ',100,' /tmp/matrix.csv

      - name: Verilator lint generated SPARV full core
        run: |
          export DESIGN_RTL_DIR="$PWD/rtl"
          verilator --lint-only -Wno-fatal \
            -Wno-BLKANDNBLK -GNUM_MHPMCOUNTERS=29 \
            --top-module cv32e40p_core_sparv \
            -f cv32e40p_manifest_sparv.flist

      - name: Verilator lint SPARV-specific RTL
        run: |
          verilator --lint-only -Wno-fatal -Irtl/include \
            rtl/include/cv32e40p_pkg.sv \
            rtl/cv32e40p_mult.sv \
            rtl/cv32e40p_hamsa_refill_32to128.sv \
            rtl/cv32e40p_hamsa_refill_native128.sv \
            rtl/cv32e40p_sparv_prefetch_ctrl.sv \
            rtl/cv32e40p_sparv_prefetch_directory.sv \
            rtl/cv32e40p_sparv_refill_arbiter.sv \
            rtl/cv32e40p_sparv_refill_manager.sv \
            rtl/cv32e40p_sparv_l0_prefetch_meta.sv \
            rtl/cv32e40p_sparv_prefetch_counters.sv \
            rtl/cv32e40p_sparv_mac_dotp_ref.sv \
            rtl/cv32e40p_sparv_mac_dotp_engine.sv \
            rtl/cv32e40p_sparv_accel_lane.sv \
            rtl/cv32e40p_sparv_mult.sv
